[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: needs a live backend on BACKEND_URL with a model loaded; deselected by default
filterwarnings =
    # asyncio's Windows proactor transports complain from __del__ when the loop
    # that owned a subprocess pipe is already closed. The parallel-UI tests kill
    # their workers deliberately (see test_parallel_cleanup), so this is noise
    # from interpreter teardown, not a leak.
    ignore:.*unclosed transport.*:ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
