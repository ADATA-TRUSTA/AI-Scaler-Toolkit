[project]
name = "ai-scaler-toolkit-launcher"
version = "0.1.0"
description = "Desktop launcher: tray, window, and first-run provisioning for AI Scaler Toolkit"
requires-python = ">=3.12"
dependencies = [
  # Window. Uses the platform webview (WebView2 on Windows, WebKitGTK on Linux) rather
  # than bundling a browser engine, which is what keeps the installer small.
  "pywebview>=5.3",
  # Tray icon, plus the imaging library it needs to load the brand .ico.
  "pystray>=0.19.5",
  "pillow>=10.4",
  # Reads the optional-components list.
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyinstaller>=6.10"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launcher"]
