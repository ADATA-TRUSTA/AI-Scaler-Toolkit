# Optional third-party tools.
#
# We show how to install these; we never run their installers. That decision removes
# three problems at once: no console/log streaming panel to build, no elevation to
# handle (the install is not our process), and no breakage when someone else changes
# their installer.
#
# The consequence is that install results cannot be reported, only detected -- so an
# undetected component reads "not installed", never "failed".

components:
  - id: hermes
    name: Hermes Agent
    description: Self-improving AI agent by Nous Research
    repo: nousresearch/hermes-agent
    show:
      type: command
      command:
        windows: 'iex (irm https://hermes-agent.nousresearch.com/install.ps1)'
        linux: 'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash'
    detect:
      path: hermes

  - id: comfyui
    name: ComfyUI
    description: Node-based generative AI workflows (official Comfy Desktop)
    show:
      type: link
      url: 'https://comfy.org/download/'
    note: >-
      On first launch it downloads its own copy of PyTorch (around 2.5 GB), separate
      from this tool's environment. Budget the disk space twice.
    detect:
      # Comfy Desktop's default install location still needs confirming against a real
      # install; until then detection reports "not installed" rather than guessing.
      windows_paths:
        - '%LOCALAPPDATA%/Programs/@comfyorgcomfyui-electron/ComfyUI.exe'
        - '%PROGRAMFILES%/ComfyUI/ComfyUI.exe'
      linux_paths:
        - '~/.local/bin/ComfyUI'
        - '/opt/ComfyUI/ComfyUI'
