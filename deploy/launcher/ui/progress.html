<title>Setting up</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #14161a;
    --muted: #626a78;
    --faint: #9aa2b1;
    --line: #e5e8ee;
    --track: #eef0f5;
    --accent: #2f6fed;
    --accent-soft: #dbe6ff;
    --ok: #1a9a5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --fg: #e9ebef; --muted: #98a0ae; --faint: #6b7280;
      --line: #262a31; --track: #1c2026; --accent: #5b8dff; --accent-soft: #1e2c4a;
      --ok: #3fbc82;
    }
  }

  /* The brand wash is built for a white page; the dark theme keeps its own ground. */
  @media (prefers-color-scheme: dark) {
    body { background: var(--bg) !important; }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--brand-bg, var(--bg));
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  main { width: min(520px, 86vw); }

  /* Header: icon beside the title, not above it -- the window is wide, not tall. */
  .head { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
  .head .mark { width: 38px; height: 38px; border-radius: 9px; flex: none; }
  .head img.mark { object-fit: contain; }
  .head div.mark {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    display: grid; place-items: center;
    color: var(--accent); font-weight: 700; font-size: 17px;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 620; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }

  /* The current step is the subject of the screen; everything else is context. */
  /* One line, and the name keeps its shape. The detail gives way instead: it shrinks
     and ends in an ellipsis. Before, the detail refused to wrap while the name was
     free to, so a long detail squeezed "Downloading a starter model" into three
     stacked lines and still ran off the edge of the window itself. */
  .step { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .step-name { font-size: 17px; font-weight: 560; white-space: nowrap; flex: none; }
  .step-detail { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums;
                 white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .track {
    margin-top: 12px; height: 6px; border-radius: 99px;
    /* Derived from the text colour rather than a fixed grey: the page sits on the
       brand's own background, which is a pale wash in one brand and near-white in
       the other, and a fixed track disappears against the first. */
    background: color-mix(in srgb, var(--fg) 9%, transparent);
    overflow: hidden; position: relative;
  }
  .fill {
    height: 100%; width: 0%; border-radius: 99px; background: var(--accent);
    transition: width 0.4s ease;
  }
  /* No measurable progress: say so by moving, rather than by showing a number that
     would have to be invented. */
  .track.indeterminate .fill {
    width: 34%; animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }

  .meta { margin-top: 10px; display: flex; justify-content: space-between; gap: 12px;
          color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* Remaining phases as a quiet row, so the shape of the whole job is visible
     without turning it into a checklist that sits still for minutes. */
  .phases { margin-top: 24px; display: flex; gap: 8px; }
  .pip {
    flex: 1; height: 3px; border-radius: 99px;
    background: color-mix(in srgb, var(--fg) 9%, transparent);
    transition: background 0.3s;
  }
  .pip.done { background: var(--accent); }
  .pip.active { background: var(--accent); opacity: 0.55; }
  .phase-names { margin-top: 9px; display: flex; justify-content: space-between;
                 color: var(--faint); font-size: 11.5px; }

  .note { margin-top: 24px; color: var(--faint); font-size: 12.5px; line-height: 1.55; }

  /* Finished */
  #done { display: none; }
  #done.show { display: block; }
  .tick { width: 40px; height: 40px; border-radius: 9px; flex: none;
          background: var(--ok); display: grid; place-items: center; color: #fff; font-size: 21px; }
  button {
    margin-top: 26px; padding: 10px 20px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 560; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }

  #error { display: none; margin-top: 20px; padding: 14px 16px; border-radius: 9px;
           border: 1px solid #d9534f; color: #d9534f; font-size: 13.5px;
           white-space: pre-wrap; max-height: 240px; overflow: auto; user-select: text; }
  #error.show { display: block; }

  /* Setup that cannot go on. Everything that reads as still working is stopped --
     the bar, the timers, "you can leave this running" -- because a failure eight
     seconds in went on looking like a setup in progress for as long as the window
     stayed open. What is left says what happened in words, shows the log only when
     the log is the explanation, and offers the one way out. */
  .track.failed { background: color-mix(in srgb, #d9534f 18%, transparent); }
  .track.failed .fill { width: 0; animation: none; }
  #failure { display: none; margin-top: 18px; }
  #failure.show { display: block; }
  #failure-message { margin: 0; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  #failure-log { margin: 12px 0 0; padding: 12px 14px; border-radius: 9px;
                 border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
                 color: var(--muted); font: 12px/1.5 ui-monospace, Consolas, monospace;
                 white-space: pre-wrap; max-height: 180px; overflow: auto; user-select: text; }
  #failure .actions { display: flex; gap: 10px; }
  #failure .actions button { margin-top: 18px; }
  button.secondary { background: transparent; color: var(--fg);
                     border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
</style>

<main>
  <div id="setup">
    <div class="head">
      <!-- The lettered tile is what shows until the mark arrives, and in a source
           checkout where no payload has been built. It is drawn by the browser, so it
           stays crisp; the image replaces it once there is one worth showing. -->
      <img class="mark" id="mark" alt="" hidden>
      <div class="mark" id="mark-fallback" aria-hidden="true">AI</div>
      <div>
        <!-- Starts as a plain "starting" screen. Most launches are not installs, and
             saying "Setting up" while nothing is being set up is simply wrong. It is
             promoted to a setup screen by setPhases, which only runs when there is
             actually something to install. -->
        <h1 id="heading">Starting AI Scaler Toolkit</h1>
        <p class="sub" id="sub" hidden>One-time setup. The GPU runtime is downloaded
          now rather than bundled.</p>
      </div>
    </div>

    <div class="step">
      <span class="step-name" id="step-name">Checking your system</span>
      <span class="step-detail" id="step-detail"></span>
    </div>
    <div class="track indeterminate" id="track"><div class="fill" id="fill"></div></div>
    <div class="meta">
      <span id="elapsed"></span>
      <span id="total-elapsed"></span>
    </div>

    <div class="phases" id="phases" hidden></div>
    <div class="phase-names" id="phase-names" hidden>
      <span id="first-phase"></span><span id="last-phase"></span>
    </div>

    <p class="note" id="note" hidden>You can leave this running. Setup usually takes
      five to ten minutes depending on your connection.</p>
  </div>

  <div id="done">
    <div class="head">
      <div class="tick">✓</div>
      <div>
        <h1>Setup complete</h1>
        <p class="sub" id="done-sub"></p>
      </div>
    </div>
    <p class="note" style="margin-top:18px">Opening the interface…</p>
  </div>

  <div id="error"></div>

  <div id="failure">
    <p id="failure-message"></p>
    <pre id="failure-log" hidden></pre>
    <div class="actions">
      <button type="button" id="close-app">Close</button>
      <button type="button" class="secondary" id="open-log" hidden>Open log</button>
    </div>
  </div>
</main>

<script>

  // The page background is the shipped brand's own, read from the stylesheet that
  // came with this payload. Only the background: the brand's action colour is a
  // saturated magenta sized for buttons, and on a progress bar it shouts and reads
  // as a warning. Applied through a variable the dark theme overrides, because the
  // brand wash is designed for a white page.
  window.setBrandBackground = function (value) {
    if (!value) { return; }
    document.documentElement.style.setProperty("--brand-bg", value);
  };
  // Sent by the host once, as a data URI: the page is loaded from a file and cannot
  // reference one from the payload directory over http.
  window.setMark = function (dataUri) {
    if (!dataUri) { return; }
    var img = document.getElementById("mark");
    img.src = dataUri;
    img.hidden = false;
    var fallback = document.getElementById("mark-fallback");
    if (fallback) { fallback.remove(); }
  };

  var keys = [];
  var startedAt = Date.now();

  function clock(seconds) {
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m > 0 ? m + "m " + (s < 10 ? "0" : "") + s + "s" : s + "s";
  }

  // Set once setup has failed: nothing on the page may go on counting after that.
  var stopped = false;

  setInterval(function () {
    var el = document.getElementById("total-elapsed");
    if (stopped || document.getElementById("done").classList.contains("show")) { return; }
    el.textContent = clock(Math.floor((Date.now() - startedAt) / 1000)) + " elapsed";
  }, 1000);

  function hostCall(name) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api[name]) {
      window.pywebview.api[name]();
    }
  }

  // Setup that cannot go on: the title in place of the step, a message in words, the
  // log only when it is the explanation, and Close -- which exits, because nothing
  // is left running that the tray could offer.
  window.showFailure = function (title, message, logText, canOpenLog) {
    stopped = true;
    document.getElementById("step-name").textContent = title || "Setup stopped";
    document.getElementById("step-detail").textContent = "";
    document.getElementById("elapsed").textContent = "";
    document.getElementById("total-elapsed").textContent = "";
    var track = document.getElementById("track");
    track.classList.remove("indeterminate");
    track.classList.add("failed");
    document.getElementById("note").hidden = true;
    document.getElementById("failure-message").textContent = message || "";
    var logEl = document.getElementById("failure-log");
    logEl.textContent = logText || "";
    logEl.hidden = !logText;
    document.getElementById("open-log").hidden = !canOpenLog;
    document.getElementById("failure").classList.add("show");
  };

  document.getElementById("close-app").onclick = function () { hostCall("close_unsupported"); };
  document.getElementById("open-log").onclick = function () { hostCall("open_log"); };

  window.setPhases = function (items) {
    // Being given steps is what makes this a setup screen rather than a splash.
    document.getElementById("heading").textContent = "Setting up AI Scaler Toolkit";
    ["sub", "phases", "phase-names", "note"].forEach(function (id) {
      document.getElementById(id).hidden = false;
    });

    keys = items.map(function (i) { return i.key; });
    var row = document.getElementById("phases");
    row.innerHTML = items.map(function () { return '<span class="pip"></span>'; }).join("");
    document.getElementById("first-phase").textContent = items.length ? items[0].label : "";
    document.getElementById("last-phase").textContent =
      items.length ? items[items.length - 1].label : "";
  };

  // Which phases have been reached, rather than how far along a fixed list we are.
  // setup_env fetches the conversion tools before the runtime on Windows and after it
  // on Linux, so marking "everything before this one" would light the wrong pips.
  var seen = {};

  window.setPhase = function (key) {
    seen[key] = true;
    // Everything ahead of the phase that just started is finished, whether or not it
    // announced itself. Setup skips work it does not need -- on a resumed run the
    // conversion tooling is already there, so it goes straight from sync to llama --
    // and marking only the phases that reported left a grey gap in the middle of a
    // run where nothing had gone wrong. A step that was not needed is a step that is
    // done.
    var at = keys.indexOf(key);
    for (var i = 0; i < at; i++) { seen[keys[i]] = true; }

    var pips = document.getElementById("phases").querySelectorAll(".pip");
    for (var n = 0; n < pips.length; n++) {
      var k = keys[n];
      pips[n].className = "pip" + (k === key ? " active" : seen[k] ? " done" : "");
    }
  };

  // fraction === null means this step has nothing measurable to report.
  window.setProgress = function (name, fraction, detail, elapsed) {
    document.getElementById("step-name").textContent = name || "";
    document.getElementById("step-detail").textContent = detail || "";
    document.getElementById("elapsed").textContent =
      typeof elapsed === "number" ? "this step: " + clock(elapsed) : "";

    var track = document.getElementById("track");
    var fill = document.getElementById("fill");
    if (typeof fraction === "number") {
      track.classList.remove("indeterminate");
      fill.style.width = Math.max(2, Math.round(fraction * 100)) + "%";
    } else {
      track.classList.add("indeterminate");
      fill.style.width = "";
    }
  };

  window.showDone = function (summary) {
    document.getElementById("setup").style.display = "none";
    document.getElementById("done-sub").textContent = summary || "";
    document.getElementById("done").classList.add("show");
  };

  window.showError = function (message, fatal) {
    var box = document.getElementById("error");
    box.textContent = message;
    box.classList.add("show");
    // Nothing here can be installed our way out of, so offer the only remaining
    // action rather than leaving a window with no way forward. Closing it exits;
    // the window disappearing on its own would read as a crash.
    if (fatal && !document.getElementById("error-close")) {
      var btn = document.createElement("button");
      btn.id = "error-close";
      btn.type = "button";
      btn.textContent = "Close";
      btn.onclick = function () {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.close_unsupported) {
          window.pywebview.api.close_unsupported();
        }
      };
      box.appendChild(btn);
    }
  };

</script>
