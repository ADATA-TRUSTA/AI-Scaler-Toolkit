[pytest]
testpaths = tests
addopts = -ra
markers =
    linux_only: exercises a Linux-only feature (fine-tuning, vLLM); auto-skipped off Linux
    inference: inference-related tests (engines, async client, dispatcher, OpenAI endpoint)
    finetune: fine-tuning related tests (training pipeline, logs/SSE, datasets, strategies)
    models: model management tests (download, conversion, registry, memory estimation)
    offload: real DeepSpeed ZeRO-3 offload training runs (GPU + large local checkpoints; slow)
    effectiveness: trains a production-sized model far enough to check it learned the task (~15 min)
    multigpu: real `deepspeed --num_gpus N` runs; auto-skips on a host with fewer than 2 NVIDIA GPUs
