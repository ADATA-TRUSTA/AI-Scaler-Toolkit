[project]
dependencies = [
  # Web / API
  # Capped by the vllm extra below (fastapi[standard]<0.137.0); would otherwise be 0.141.1.
  "fastapi==0.136.3",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.3",
  "python-multipart==0.0.32",
  "pydantic==2.13.4",
  # Infra / IO
  "redis==8.1.0",
  # This service's own HTTP client (sync + async); openai/starlette use it too.
  # httpx itself still arrives transitively via huggingface-hub / datasets / chromadb.
  "httpx2==2.10.0",
  "python-dotenv==1.2.2",
  "psutil==7.2.2",
  "nvidia-ml-py==13.610.43", # provides the `pynvml` module
  # Capped by the vllm extra below: vllm -> numba wants numpy<2.5, and -> mistral-common
  # wants numpy<2.4 on python<3.13. Would otherwise be 2.5.2. The lock is universal, so
  # every host pays this, including the ones that never install vllm.
  #
  # lmcache (also in the vllm extra) caps it harder still, at numpy<=2.2.6 -- that is
  # the binding constraint, not vllm's <2.4. Dropping lmcache is what would let this
  # go back to 2.3.5.
  "numpy==2.2.6",
  "pillow==12.3.0", # ML / inference / training
  # torch (+cu130 / +xpu variants) comes from the cuda/xpu extras below
  "transformers==5.15.0",
  "trl==1.10.0",
  "peft==0.20.0",
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "bitsandbytes==0.50.1",
  "safetensors==0.8.0",
  "huggingface-hub==1.27.0",
  "gguf==0.19.0",
  "openai==3.0.0",
  "openai-harmony==0.0.8",
  "tiktoken==0.13.0", # GPT-OSS / harmony tokenizer (see TIKTOKEN_RS_CACHE_DIR in settings.py)
  "sentencepiece==0.2.2", # GGUF conversion vocab path (convert_hf_to_gguf.py); see conversion_manager.py
  # RAG: vector retrieval (lazily imported inside rag_manager.py)
  "chromadb==1.5.9",
  "sentence-transformers==5.7.0", # Model backends loaded dynamically by transformers (not imported directly)
  "deepspeed==0.19.2; sys_platform == 'linux'",
  # causal-conv1d builds a CUDA extension and has no XPU support, so it lives in
  # the cuda extra below rather than here.
  "flash-linear-attention==0.5.2",
  "fla-core==0.5.2",
]
description = "Add your description here"
name = "service"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.optional-dependencies]
# CUDA (NVidia): pulls the +cu130 variants from the PyTorch CUDA index.
# torch is 2.13.0 to satisfy the vllm extra below; the xpu extra moved with it.
cuda = [
  "torch==2.13.0+cu130",
  "torchvision==0.28.0+cu130",
  # torchaudio has not followed torch's version numbering; 2.11.0 is the newest that exists.
  "torchaudio==2.11.0+cu130",
  # CUDA-only: the package compiles a CUDA extension, so it must not be pulled in
  # by the xpu extra (the cuda/xpu conflict declared under [tool.uv] keeps them apart).
  "causal-conv1d==1.6.2.post1; sys_platform == 'linux'",
]
# vLLM inference backend. Linux + CUDA only (no Windows wheels), so setup_env adds this
# extra alongside `cuda` and never alongside `xpu`.
#
# This extra drives the torch, fastapi and numpy pins above, so upgrading it is a
# whole-project change: check what the new release does to those three first.
vllm = [
  "vllm==0.27.1; sys_platform == 'linux'",
  # LMCache KV connector (vllm_lmcache_enabled). Ships alongside vllm rather than in
  # its own extra because vLLM loads it in-process: LMCacheConnectorV1 imports
  # lmcache.integration.vllm, so the two have to live in the same environment.
  # Its numpy<=2.2.6 cap is what holds numpy back above.
  #
  # 0.5.4 is the newest release; it does not declare which vLLM it targets, so the
  # pairing is not something the resolver can check. The earlier 0.5.3 pin was chosen
  # against vllm 0.20.1 and does not carry over to 0.27.1.
  "lmcache==0.5.4; sys_platform == 'linux'",
]
# Intel XPU (Arc / iGPU): pulls the +xpu variants from the PyTorch XPU index; works on Linux and Windows.
# torch 2.13.0+xpu bundles the oneAPI 2026.0.0 runtime, which needs Intel graphics driver
# 32.0.101.8801 or newer — scripts/xpu_smoke.py is what catches a driver that is too old.
xpu = [
  "torch==2.13.0+xpu",
  "torchvision==0.28.0+xpu",
  "torchaudio==2.11.0+xpu",
  "triton-xpu==3.7.2",
]

[dependency-groups]
dev = [
  "ruff==0.16.3",
  "pytest==9.1.1",
  "pre-commit==4.6.2",
  "pyright==1.1.411",
]

[tool.ruff] # https://docs.astral.sh/ruff/settings/#top-level
# The project root moved up to the repo root; lint only this project's own source (service/),
# excluding tests and vendored third-party code.
exclude = [
  ".venv",
  "tests", # repo-root tests keep the "strict service rules do not apply to tests" convention
  # vendored third-party Python; must not be scanned by this project's rules
  "service/utils/llama.cpp",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint] # https://docs.astral.sh/ruff/settings/#lint
extend-select = [
  # "ERA001", # commented-out-code
  "FAST001", # fast-api-redundant-response-model
  "FAST002", # fast-api-non-annotated-dependency
  "D100", # missing-module-docstring
  "D101", # undocumented-public-class
  "D102", # missing-class-docstring
  "D103", # undocumented-public-function
  "D213", # multi-line-summary-second-line
  "D400", # missing-trailing-period
]
select = [
  "B", # flake8-bugbear
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "S", # bandit
  "W", # pycodestyle
  "UP", # pyupgrade
  "C4", # flake8-comprehensions
  "ANN", # flake8-annotations
  "TRY", # tryceratops
  "PERF", # perflint
  "ASYNC", # flake8-async
]

# Globally ignore noisy rules
ignore = [
  "E402", # module level import not at top of file
  "E501", # line-too-long — ruff format owns code width; long strings/comments are not hard-wrapped
  "TRY003", # Avoid specifying long messages outside the exception class
  "TRY301", # Abstract `raise` to an inner function
  "TRY300", # Consider-else — too picky about the common try/return/except HTTPException endpoint idiom
  "TRY401", # Redundant exception in logging.exception msg — keeping {e} aids log grepping
  # This service does a lot of best-effort hardware/device probing and spawns its own subprocesses
  # (vLLM / llama server). The rules below have too low a signal-to-noise ratio here, so they are
  # disabled wholesale (the rarer S rules stay on and are marked with noqa at the call site).
  "S110", # try-except-pass — skipping a failed probe is normal here
  "S112", # try-except-continue — same as above
  "S603", # subprocess-without-shell-equals-true — known high false-positive rate; commands are built in code, not user input
  "S607", # start-process-with-partial-path — resolving python / uv via PATH is intentional
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: using Body/Depends/Query/... as parameter defaults is correct, not a B008 error.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Form",
  "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # Allow use of assert statements in tests
  "S105", # hardcoded-password-string
  "S106", # hardcoded-password-func-arg
]

[tool.ruff.format] # https://docs.astral.sh/ruff/settings/#format
quote-style = "double" # Quote style, double quotes are default

[[tool.uv.index]]
explicit = true
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
explicit = true
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
explicit = true
name = "pytorch-whl"
url = "https://download.pytorch.org/whl"

[tool.uv.sources]
torch = [
  {index = "pytorch-cuda", extra = "cuda"},
  {index = "pytorch-xpu", extra = "xpu"},
]
torchaudio = [
  {index = "pytorch-cuda", extra = "cuda"},
  {index = "pytorch-xpu", extra = "xpu"},
]
torchvision = [
  {index = "pytorch-cuda", extra = "cuda"},
  {index = "pytorch-xpu", extra = "xpu"},
]
triton-xpu = {index = "pytorch-whl"}

[tool.uv]
conflicts = [
  [{extra = "cuda"}, {extra = "xpu"}],
]
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]
# causal-conv1d has no prebuilt wheel for newer CUDA toolkits and must build
# its CUDA extension from source. With normal build isolation, uv resolves a
# fresh (unpinned) `torch` into the isolated build env, which can mismatch the
# system's CUDA toolkit version and fail the build. Building against the
# project's already-installed torch (matching the local CUDA toolkit) avoids
# the mismatch.
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.workspace]
exclude = [
  "service/utils/llama.cpp",
]

[tool.pyright]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  ".uv-cache",
  ".cache",
  "tests",
  "examples",
  "service/utils/llama.cpp",
  # Vendored vLLM sources: gitignored (.gitignore excludes the whole engine dir) and
  # nothing under it is tracked, so it is third-party code that happens to sit in the
  # tree. The pyright hook runs with pass_filenames: false, i.e. always over the whole
  # project, so without this entry it type-checks 4.7k files it does not own and fails
  # the commit gate on ~30k errors that no change here can fix.
  "service/inference/engines/vllm_server_cpu",
]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
