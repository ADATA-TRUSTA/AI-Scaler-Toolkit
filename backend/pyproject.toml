[project]
dependencies = [
  # Web / API
  # Capped by the vllm extra below (fastapi[standard]<0.137.0); would otherwise be 0.141.1.
  "fastapi==0.136.3",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.3",
  "python-multipart==0.0.32",
  "pydantic==2.13.4",
  # Infra / IO
  "redis==8.1.0",
  # This service's own HTTP client (sync + async); openai/starlette use it too.
  # httpx itself still arrives transitively via huggingface-hub / datasets / chromadb.
  "httpx2==2.10.0",
  "python-dotenv==1.2.2",
  "psutil==7.2.2",
  "nvidia-ml-py==13.610.43", # provides the `pynvml` module
  # Capped by the vllm extra below: vllm -> numba wants numpy<2.5, and -> mistral-common
  # wants numpy<2.4 on python<3.13. Would otherwise be 2.5.2. The lock is universal, so
  # every host pays this, including the ones that never install vllm.
  #
  # 2.2.6 was lmcache's cap, and lmcache is gone, so vllm's <2.4 is now the binding
  # constraint and this could move to 2.3.5. Left as is: a numpy bump is a separate,
  # whole-project change.
  "numpy==2.2.6",
  "pillow==12.3.0", # ML / inference / training
  # torch (+cu130 / +xpu variants) comes from the cuda/xpu extras below
  "transformers==5.15.0",
  # Required to keep MXFP4 checkpoints (gpt-oss) packed. Without it transformers'
  # Mxfp4HfQuantizer silently dequantizes the experts to bf16, turning the 65 GB
  # gpt-oss-120b checkpoint into a 233 GB model. transformers 5.15.0 accepts
  # 0.16.0 <= kernels < 0.17.0; do not bump past that without checking
  # KERNELS_MAX_VERSION in transformers/utils/import_utils.py.
  "kernels==0.16.1",
  "trl==1.10.0",
  "peft==0.20.0",
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "bitsandbytes==0.50.1",
  "safetensors==0.8.0",
  "huggingface-hub==1.27.0",
  "gguf==0.19.0",
  "openai==3.0.0",
  "openai-harmony==0.0.8",
  "tiktoken==0.13.0", # GPT-OSS / harmony tokenizer (see TIKTOKEN_RS_CACHE_DIR in settings.py)
  "sentencepiece==0.2.2", # GGUF conversion vocab path (convert_hf_to_gguf.py); see conversion_manager.py
  # RAG: vector retrieval (lazily imported inside rag_manager.py)
  "chromadb==1.5.9",
  "sentence-transformers==5.7.0", # Model backends loaded dynamically by transformers (not imported directly)
  "deepspeed==0.19.2; sys_platform == 'linux'",
  # causal-conv1d builds a CUDA extension and has no XPU support, so it lives in
  # the cuda extra below rather than here.
  "flash-linear-attention==0.5.2",
  "fla-core==0.5.2",
]
description = "Add your description here"
name = "service"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.2"

[project.optional-dependencies]
# CUDA (NVidia): pulls the +cu130 variants from the PyTorch CUDA index.
# torch is 2.13.0 to satisfy the vllm extra below; the xpu extra moved with it.
cuda = [
  "torch==2.13.0+cu130",
  "torchvision==0.28.0+cu130",
  # torchaudio has not followed torch's version numbering; 2.11.0 is the newest that exists.
  "torchaudio==2.11.0+cu130",
  # CUDA-only: the package compiles a CUDA extension, so it must not be pulled in
  # by the xpu extra (the cuda/xpu conflict declared under [tool.uv] keeps them apart).
  "causal-conv1d==1.6.2.post1; sys_platform == 'linux'",
  # The nvcc toolchain, pinned to the same CUDA minor as the runtime torch brings.
  # torch==2.13.0+cu130 holds nvidia-cuda-runtime and -nvrtc at 13.0.x, but nothing
  # pinned the compiler, so it floated to the newest release (13.3, now 13.4) and
  # nvcc refused to compile against 13.0 headers:
  #
  #   error: "CUDA compiler and CUDA toolkit headers are incompatible,
  #           please check your include paths"
  #
  # All three have to be pinned, not just nvcc: nvcc ships the driver and ptxas,
  # while cicc (the device front end) comes from nvidia-nvvm and the headers from
  # nvidia-cuda-crt -- and nvcc requires both of those without a version bound.
  # Pinning nvcc alone leaves cicc 13.3 emitting PTX that ptxas 13.0 rejects:
  #
  #   ptxas fatal: Unsupported .version 9.3; current version is '9.0'
  #
  # This goes unnoticed on a machine with a system CUDA toolkit, because
  # causal-conv1d finds /usr/local/cuda first and that is internally consistent.
  # Only a machine with just a driver -- which is most of them -- assembles the
  # mismatched set, and then fails after several gigabytes have downloaded.
  "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
  "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
  "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
  # CCCL (nv/target, cub, thrust) is part of a toolkit too, and llama.cpp's CUDA build
  # includes it from cuda_fp16.h. It used to arrive only through vllm (humming-kernels[cu13],
  # unbounded, so at 13.3), which left TRUSTA_SETUP_VLLM=0 failing with
  #
  #   cuda_fp16.h: fatal error: nv/target: No such file or directory
  #
  # and the default install pairing 13.3 headers with the 13.0 compiler. Pinned here
  # with the rest of the toolchain.
  "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
]
# vLLM inference backend. Linux + CUDA only (no Windows wheels), so setup_env adds this
# extra alongside `cuda` and never alongside `xpu`.
#
# This extra drives the torch, fastapi and numpy pins above, so upgrading it is a
# whole-project change: check what the new release does to those three first.
vllm = [
  # 0.28.0, not 0.27.1: the Gemma4 arch convertor in 0.27.1 reads head_dim off the
  # global text config, which Transformers >= 5.15.0 refuses for a heterogeneous
  # model. gemma-4-E4B is heterogeneous for real -- 35 sliding layers at head_dim
  # 256 and 7 full-attention layers at 512 -- so the read raises
  # AmbiguousGlobalPerLayerAttributeError and every gemma-4 load fails at startup.
  # 0.28.0 builds the per-layer configs instead. torch stays at 2.13.0 across the
  # bump, which is what makes it a single-package move.
  "vllm==0.28.0; sys_platform == 'linux'",
]
# The same vLLM release built for Intel XPU, from vLLM's own index (PyPI carries only the
# CUDA build, which is all the `vllm` extra above can ever resolve to). setup_env adds this
# alongside `xpu`, as it adds `vllm` alongside `cuda`; the two never meet (see conflicts).
# It asks for torch==2.13.0, which the xpu extra's 2.13.0+xpu satisfies, and for
# triton==3.7.2+xpu, a shim on the same index that only requires triton-xpu==3.7.2 -- what
# the xpu extra installs anyway. Its kernels (vllm-xpu-kernels) come from PyPI.
vllm-xpu = [
  "vllm==0.28.0+xpu; sys_platform == 'linux'",
  # Named here only so its source below can be tied to this extra (uv requires that).
  "triton==3.7.2+xpu; sys_platform == 'linux'",
  # The xpu extra's torch, repeated: uv resolves every extra on its own as well as
  # together, and alone this one would take PyPI's CUDA torch, whose triton 3.7.1 the
  # shim above cannot satisfy. Kept identical to the xpu extra below.
  "torch==2.13.0+xpu; sys_platform == 'linux'",
  "torchvision==0.28.0+xpu; sys_platform == 'linux'",
  "torchaudio==2.11.0+xpu; sys_platform == 'linux'",
  "triton-xpu==3.7.2; sys_platform == 'linux'",
  # vLLM imports torchcodec at startup, and PyPI's build links CUDA's libnvrtc: on an
  # Intel host vLLM died with "libnvrtc.so.13: cannot open shared object file". The
  # PyTorch XPU index carries the same release built without CUDA.
  "torchcodec==0.16.0+cpu; sys_platform == 'linux'",
]
# Intel XPU (Arc / iGPU): pulls the +xpu variants from the PyTorch XPU index; works on Linux and Windows.
# torch 2.13.0+xpu bundles the oneAPI 2026.0.0 runtime, which needs Intel graphics driver
# 32.0.101.8801 or newer — scripts/xpu_smoke.py is what catches a driver that is too old.
xpu = [
  "torch==2.13.0+xpu",
  "torchvision==0.28.0+xpu",
  "torchaudio==2.11.0+xpu",
  "triton-xpu==3.7.2",
]

[dependency-groups]
dev = [
  "ruff==0.16.3",
  "pytest==9.1.1",
  "pre-commit==4.6.2",
  "pyright==1.1.411",
]

[tool.ruff] # https://docs.astral.sh/ruff/settings/#top-level
# The project root moved up to the repo root; lint only this project's own source (service/),
# excluding tests and vendored third-party code.
exclude = [
  ".venv",
  "tests", # repo-root tests keep the "strict service rules do not apply to tests" convention
  # vendored third-party Python; must not be scanned by this project's rules
  "service/utils/llama.cpp",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint] # https://docs.astral.sh/ruff/settings/#lint
extend-select = [
  # "ERA001", # commented-out-code
  "FAST001", # fast-api-redundant-response-model
  "FAST002", # fast-api-non-annotated-dependency
  "D100", # missing-module-docstring
  "D101", # undocumented-public-class
  "D102", # missing-class-docstring
  "D103", # undocumented-public-function
  "D213", # multi-line-summary-second-line
  "D400", # missing-trailing-period
]
select = [
  "B", # flake8-bugbear
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "S", # bandit
  "W", # pycodestyle
  "UP", # pyupgrade
  "C4", # flake8-comprehensions
  "ANN", # flake8-annotations
  "TRY", # tryceratops
  "PERF", # perflint
  "ASYNC", # flake8-async
]

# Globally ignore noisy rules
ignore = [
  "E402", # module level import not at top of file
  "E501", # line-too-long — ruff format owns code width; long strings/comments are not hard-wrapped
  "TRY003", # Avoid specifying long messages outside the exception class
  "TRY301", # Abstract `raise` to an inner function
  "TRY300", # Consider-else — too picky about the common try/return/except HTTPException endpoint idiom
  "TRY401", # Redundant exception in logging.exception msg — keeping {e} aids log grepping
  # This service does a lot of best-effort hardware/device probing and spawns its own subprocesses
  # (vLLM / llama server). The rules below have too low a signal-to-noise ratio here, so they are
  # disabled wholesale (the rarer S rules stay on and are marked with noqa at the call site).
  "S110", # try-except-pass — skipping a failed probe is normal here
  "S112", # try-except-continue — same as above
  "S603", # subprocess-without-shell-equals-true — known high false-positive rate; commands are built in code, not user input
  "S607", # start-process-with-partial-path — resolving python / uv via PATH is intentional
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: using Body/Depends/Query/... as parameter defaults is correct, not a B008 error.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Form",
  "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # Allow use of assert statements in tests
  "S105", # hardcoded-password-string
  "S106", # hardcoded-password-func-arg
]

[tool.ruff.format] # https://docs.astral.sh/ruff/settings/#format
quote-style = "double" # Quote style, double quotes are default

[[tool.uv.index]]
explicit = true
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
explicit = true
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
explicit = true
name = "pytorch-whl"
url = "https://download.pytorch.org/whl"

# vLLM's per-release index; this path holds the 0.28.0 XPU build and its triton shim.
[[tool.uv.index]]
explicit = true
name = "vllm-xpu"
url = "https://wheels.vllm.ai/0.28.0/xpu"

[tool.uv.sources]
torch = [
  {index = "pytorch-cuda", extra = "cuda"},
  {index = "pytorch-xpu", extra = "xpu"},
  {index = "pytorch-xpu", extra = "vllm-xpu"},
]
torchaudio = [
  {index = "pytorch-cuda", extra = "cuda"},
  {index = "pytorch-xpu", extra = "xpu"},
  {index = "pytorch-xpu", extra = "vllm-xpu"},
]
torchvision = [
  {index = "pytorch-cuda", extra = "cuda"},
  {index = "pytorch-xpu", extra = "xpu"},
  {index = "pytorch-xpu", extra = "vllm-xpu"},
]
triton-xpu = {index = "pytorch-whl"}
# Only for vllm-xpu; with any other extra both resolve from PyPI as before.
vllm = [{index = "vllm-xpu", extra = "vllm-xpu"}]
torchcodec = [{index = "pytorch-xpu", extra = "vllm-xpu"}]
triton = [{index = "vllm-xpu", extra = "vllm-xpu"}]

[tool.uv]
conflicts = [
  [{extra = "cuda"}, {extra = "xpu"}],
  [{extra = "vllm"}, {extra = "vllm-xpu"}],
  [{extra = "cuda"}, {extra = "vllm-xpu"}],
  [{extra = "xpu"}, {extra = "vllm"}],
]
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]
# causal-conv1d has no prebuilt wheel for newer CUDA toolkits and must build
# its CUDA extension from source. With normal build isolation, uv resolves a
# fresh (unpinned) `torch` into the isolated build env, which can mismatch the
# system's CUDA toolkit version and fail the build. Building against the
# project's already-installed torch (matching the local CUDA toolkit) avoids
# the mismatch.
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.workspace]
exclude = [
  "service/utils/llama.cpp",
]

[tool.pyright]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  ".uv-cache",
  ".cache",
  "tests",
  "examples",
  "service/utils/llama.cpp",
  # Vendored vLLM sources: gitignored (.gitignore excludes the whole engine dir) and
  # nothing under it is tracked, so it is third-party code that happens to sit in the
  # tree. The pyright hook runs with pass_filenames: false, i.e. always over the whole
  # project, so without this entry it type-checks 4.7k files it does not own and fails
  # the commit gate on ~30k errors that no change here can fix.
  "service/inference/engines/vllm_server_cpu",
]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
